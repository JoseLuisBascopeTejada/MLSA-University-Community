services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      # Needed for HMR with Windows bind mounts
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
