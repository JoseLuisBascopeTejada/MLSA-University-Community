<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="[TODO-CONTENT: meta description ES]" />
    <meta name="color-scheme" content="dark light" />
    <title>MLSA University Community</title>
    <script>
      // Theme bootstrap: runs before paint (no flash). Mirrors THEME_KEY in
      // src/lib/config.ts ('mlsa-theme') — duplicated here because this inline
      // script cannot import modules. Stored choice wins; otherwise follow the
      // OS (light only if it explicitly prefers light); default to dark.
      try {
        var t = localStorage.getItem('mlsa-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
